# Zero-shot Gemma evaluation configuration
gemma_zero_shot:
  output_dir: outputs/gemma_zero_shot
  datasets:
    - name: Recipes5k
      enabled: true
      model_name: google/gemma-3-27b-it
      embeddings_subdir: Recipes5k
      label_col: class
      text_col: ingredients
      image_col: image
      backbone: clip
    - name: Recipes5k
      enabled: true
      model_name: google/gemma-3-4b-it
      embeddings_subdir: Recipes5k
      label_col: class
      text_col: ingredients
      image_col: image
      backbone: clip
    - name: fakeddit
      enabled: true
      model_name: google/gemma-3-27b-it
      embeddings_subdir: fakeddit
      label_col: 2_way_label
      text_col: text
      image_col: id
      backbone: clip
    - name: fakeddit
      enabled: true
      model_name: google/gemma-3-4b-it
      embeddings_subdir: fakeddit
      label_col: 2_way_label
      text_col: text
      image_col: id
      backbone: clip
    - name: mbrset
      enabled: true
      model_name: google/medgemma-27b-it
      embeddings_subdir: mbrset
      label_col: DR_2
      text_col: text
      image_col: file
      backbone: clip
    - name: mbrset
      enabled: true
      model_name: google/medgemma-4b-it
      embeddings_subdir: mbrset
      label_col: DR_2
      text_col: text
      image_col: file
